<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Algorithm Visualiser</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="hero">
        <h1>Algorithm Visualiser</h1>
    
        <p>Visualise how algorithms work step by step.</p>
    </header>
    <button id="generate-button">Generate Array</button>
    
    <select id="algorithm-select">
        <option value="bubble">Bubble Sort</option>
        <option value="selection">Selection Sort</option>
        <option value="insertion">Insertion Sort</option>
        <option value="merge">Merge Sort</option>
        <option value="quick">Quick Sort</option>
        <option value="radix">Radix Sort</option>
    </select>
    
    <button id="sort-button">Sort</button>
    
    <label for="speed-slider">
        Speed: <span id="speed-value">150</span> ms
    </label>
    
    <input type="range" id="speed-slider" min="10" max="200" value="50">
    
    <div class="stats-container">
        <div class="stat-card">
            <span class="stat-label">Comparisons</span>
            <span id="comparison-count" class="stat-value">0</span>
        </div>
    
        <div class="stat-card">
            <span class="stat-label">Swaps</span>
            <span id="swap-count" class="stat-value">0</span>
        </div>
    
    </div>
    
    <label for="size-slider">
        Array Size: <span id="size-value">30</span>
    </label>
    
    <input type="range" id="size-slider" min="10" max="99" value="30">
    
    <div id="array-container"></div>
    <div id="bucket-container"></div>
    <script src="script.js"></script>

</body>

</html>
