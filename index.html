<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Algorithm Visualiser</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Algorithm Visualiser</h1>

    <p>Visualise how algorithms work step by step.</p>

    <button id="generate-button">Generate Array</button>
    <button id="sort-button">Bubble Sort</button>
    <label for="speed-slider">Speed:</label>
    <input type="range" id="speed-slider" min="10" max="200" value="50">
    <div id="array-container"></div>

    <script src="script.js"></script>

</body>

</html>
